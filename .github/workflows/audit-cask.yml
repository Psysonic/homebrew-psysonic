name: Audit cask

# Runs the checks Homebrew's own CI runs on a submitted cask, on a machine with
# a working toolchain. macos-latest is Apple Silicon, so this also exercises the
# arm64 download, which no maintainer here can test locally.

on:
  workflow_dispatch:
  push:
    paths:
      - "Casks/**"
      - ".github/workflows/audit-cask.yml"

permissions:
  contents: read

jobs:
  audit:
    name: audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The cask carries an on_linux branch, so it has to be exercised on
        # Linux too. Neither result may hide the other, hence fail-fast: false.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v5

      # The runner image ships an older Homebrew than the one homebrew-cask's
      # own CI runs, and rules are disabled there first. Without this the audit
      # passes here and fails on submission, which is exactly what happened
      # with `depends_on macos: :catalina`.
      - name: Set up the same Homebrew homebrew-cask CI uses
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

      # setup-homebrew recognises a repository named homebrew-* as a tap and
      # symlinks this checkout into place itself. Do not link it by hand: a
      # copied directory replaces that symlink and its teardown then fails.
      - name: Record the version and the linked tap
        run: |
          brew --version
          brew tap

      - name: Formatting
        run: brew style --cask psysonic/psysonic/psysonic

      - name: Audit against the network
        run: brew audit --cask --online psysonic/psysonic/psysonic

      - name: Audit as a new cask
        run: brew audit --cask --new psysonic/psysonic/psysonic

      # The cask carries no livecheck block: the default strategy is expected to
      # read the GitHub releases and skip release candidates. Prove it resolves
      # the current version rather than assuming it.
      - name: Version detection without a livecheck block
        run: brew livecheck --cask --json psysonic/psysonic/psysonic

      - name: Install and remove again
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
        run: |
          brew trust --cask psysonic/psysonic/psysonic
          brew install --cask psysonic/psysonic/psysonic
          # Platform-independent proof, and it prints where the artifact landed.
          brew list --cask psysonic/psysonic/psysonic
          if [ "$RUNNER_OS" = "macOS" ]; then test -d /Applications/Psysonic.app; fi
          brew uninstall --cask psysonic/psysonic/psysonic
