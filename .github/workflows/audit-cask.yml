name: Audit cask

# Runs the checks Homebrew's own CI runs on a submitted cask, on a machine with
# a working toolchain. macos-latest is Apple Silicon, so this also exercises the
# arm64 download, which no maintainer here can test locally.

on:
  workflow_dispatch:
  push:
    paths:
      - "Casks/**"
      - ".github/workflows/audit-cask.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v5

      # The runner image ships an older Homebrew than the one homebrew-cask's
      # own CI runs, and rules are disabled there first. Without this the audit
      # passes here and fails on submission, which is exactly what happened
      # with `depends_on macos: :catalina`.
      - name: Set up the same Homebrew homebrew-cask CI uses
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

      - name: Record the version under test
        run: brew --version

      - name: Link this checkout as the tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/psysonic/homebrew-psysonic"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          cp -R "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap

      - name: Formatting
        run: brew style --cask psysonic/psysonic/psysonic

      - name: Audit against the network
        run: brew audit --cask --online psysonic/psysonic/psysonic

      - name: Audit as a new cask
        run: brew audit --cask --new psysonic/psysonic/psysonic

      - name: Install and remove again
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
        run: |
          brew trust --cask psysonic/psysonic/psysonic
          brew install --cask psysonic/psysonic/psysonic
          test -d /Applications/Psysonic.app
          brew uninstall --cask psysonic/psysonic/psysonic

      # The copied tap is a plain directory, and setup-homebrew's own cleanup
      # expects to remove a symlink. Clear it here so the job does not end red
      # on teardown alone.
      - name: Unlink the tap again
        if: always()
        run: rm -rf "$(brew --repository)/Library/Taps/psysonic"
